name: IPLTB Backend CI/CD
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
    workflows_dispatch:

    
jobs:
  test:
    name: "1. Run Backend Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '26'
      - name: Install dependencies
        run: npm install
        working-directory: ./backend
      - name: Run tests
        run: npm test -- --watch=false
        working-directory: ./backend
      - name: print success message
        run: echo "Tests completed successfully."
  deploy:
    name: "3. Deploy via fp-infra"
    needs: test
    uses: matanmou/fp-infra/.github/workflows/backend.yaml@main
    with:
      image: matanmo93/fp-backend:${{ github.sha }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  after-deploy:
    name: "4. After deploy"
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - run: echo "Deployed ${{ needs.deploy.outputs.deployed-image }}, continuing..."