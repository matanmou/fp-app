<div class="modal-header" dir="rtl">
  <h4 class="modal-title pull-left">בחר קבוצה למקום ה-{{palce}}</h4>
  <button type="button" class="close pull-right cb" aria-label="Close" (click)="bsModalRef.hide()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="list-group">
    @for (team of teams; track team.id) {
      @if (alreadyChose(team)) {
    <button type="button" class="list-group-item list-group-item-action" (click)="teamChose(team.id)" [style]="setMyStyle(team)"> {{team.teamName}}</button>
      } @else {
    <button type="button" class="list-group-item list-group-item-action chos" (click)="teamChose(team.id)"><span class="chosen">{{team.teamName}}</span></button>
      }
    }
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-default cb" (click)="bsModalRef.hide()">סגור</button>
</div>
